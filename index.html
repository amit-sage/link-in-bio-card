<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amit | Software Engineer</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ffd194, #b67b2e, #ffd194);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: hidden;
    }

    .card {
      background: rgba(234,182,118, 0.15);
      backdrop-filter: blur(25px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
      max-width: 400px;
      width: 100%;
      padding: 40px 30px;
      text-align: center;
      color: #fff;
      animation: fadeInUp 1s ease forwards;
      opacity: 0;
      transform: translateY(50px);
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #fff;
      box-shadow: 0 0 18px rgba(255, 255, 255, 0.4);
      margin-bottom: 20px;
    }

    h1 {
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .typing {
      color: #e0e0e0;
      font-size: 16px;
      margin-bottom: 20px;
      height: 20px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: hidden; /* default */
    }

    .links a,
    .resume-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      text-decoration: none;
      color: white;
      transition: 0.3s ease;
      font-size: 16px;
      font-weight: 500;
    }

    .links a:hover,
    .resume-btn:hover {
      background: rgba(255, 255, 255, 0.4);
      color: #000;
    }

    .resume-btn {
      margin-top: 15px;
      cursor: pointer;
    }

    .down-arrow {
      display: none;
      font-size: 20px;
      color: #ccc;
      margin-top: 8px;
      animation: bounce 1.5s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(6px); }
    }

    footer {
      margin-top: 30px;
      font-size: 13px;
      color: #ccc;
    }

    @media (max-width: 480px) {
      .card {
        padding: 30px 20px;
      }

      h1 {
        font-size: 22px;
      }

      .typing {
        font-size: 14px;
      }

      .links {
        max-height: 180px;
        overflow-y: auto;
        padding-right: 5px;
      }

      .down-arrow {
        display: block;
      }

      /* Optional: nicer mobile scrollbar */
      .links::-webkit-scrollbar {
        width: 4px;
      }

      .links::-webkit-scrollbar-thumb {
        background: #a4a4a4;
        border-radius: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="card" id="profileCard">
    <img src="profile.jpg" alt="Amit's Profile" class="avatar">
    <h1>Amit Choudhary</h1>
    <div class="typing" id="typingText">Loading...</div>

    <div class="links">
      <a href="https://www.youtube.com/@mystudybuilder" target="_blank" rel="noopener noreferrer"><i class="fab fa-youtube"></i> YouTube</a>
      <a href="http://amitcode.zya.me/" target="_blank" rel="noopener noreferrer"><i class="fas fa-briefcase"></i> Portfolio</a>
      <a href="https://www.linkedin.com/in/amit-kumar-434162293/" target="_blank" rel="noopener noreferrer"><i class="fab fa-linkedin"></i> LinkedIn</a>
      <a href="https://github.com/amit-sage" target="_blank" rel="noopener noreferrer"><i class="fab fa-github"></i> GitHub</a>
      <a href="https://www.snapchat.com/add/amitab0001?share_id=kh4Mj4O39BQ&locale=en-GB" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-snapchat"></i> Snapchat</a>
      <a href="mailto:contact.amitkumar143@gmail.com"><i class="fas fa-envelope"></i> Contact</a>
    </div>

    <!-- Down arrow shown only on mobile -->
    <div class="down-arrow">
      <i class="fas fa-chevron-down"></i>
    </div>

    <a class="resume-btn" href="resume.pdf" download><i class="fas fa-file-download"></i> Download Resume</a>

    <footer>&copy;2025 Amit Choudhary. All Rights Reserved.</footer>
  </div>

  <script>
    const roles = ["UI/UX Designer", "MERN Stack Developer", "Content Creator"];
    let currentRole = 0;
    let index = 0;
    const typingText = document.getElementById("typingText");

    function typeRole() {
      if (index < roles[currentRole].length) {
        typingText.textContent += roles[currentRole].charAt(index);
        index++;
        setTimeout(typeRole, 100);
      } else {
        setTimeout(() => {
          index = 0;
          typingText.textContent = "";
          currentRole = (currentRole + 1) % roles.length;
          typeRole();
        }, 1800);
      }
    }

    typeRole();
  </script>
</body>
</html>
