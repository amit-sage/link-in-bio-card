<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amit | Software Engineer</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #b83100b5, #000000);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: hidden;
    }

    .card {
      background: rgba(234,182,118, 0.15);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
      width: 100%;
      max-width: 400px;
      padding: 40px 30px;
      text-align: center;
      color: #fff;
      opacity: 0;
      transform: translateY(50px);
      animation: fadeInUp 1s ease forwards;
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card.out {
      animation: fadeOutDown 0.6s ease forwards;
    }

    @keyframes fadeOutDown {
      to {
        opacity: 0;
        transform: translateY(50px);
      }
    }

    .avatar {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #fff;
      box-shadow: 0 0 18px rgba(255, 255, 255, 0.4);
      margin-bottom: 20px;
    }

    h1 {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    p {
      font-size: 16px;
      color: #e0e0e0;
      margin-bottom: 25px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .links a {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      text-decoration: none;
      color: white;
      transition: 0.3s ease;
      font-size: 16px;
      font-weight: 500;
    }

    .links a:hover {
      background: rgba(255, 255, 255, 0.4);
      color: #000;
    }

    footer {
      margin-top: 30px;
      font-size: 13px;
      color: #ccc;
    }

    @media (max-width: 480px) {
      body {
        padding: 10px;
      }
      .card {
        padding: 30px 20px;
      }

      h1 {
        font-size: 24px;
      }

      p {
        font-size: 14px;
      }

      .links a {
        font-size: 14px;
        padding: 10px 14px;
      }
    }
  </style>
</head>
<body>
<div class="card">
    <img src="profile.jpg" alt="Amit's Profile" class="avatar">
    <h1>Amit Choudhary</h1>
    <p>UI/UX Designer | MERN Stack Developer</p>
    <div class="links">
      <a href="https://www.youtube.com/@mystudybuilder" target="_blank" rel="noopener noreferrer"><i class="fab fa-youtube"></i> YouTube</a>
      <a href="http://amitcode.zya.me/"target="_blank" rel="noopener noreferrer"><i class="fas fa-briefcase"></i> Portfolio</a>
      <a href="https://www.linkedin.com/in/amit-kumar-434162293/"target="_blank" rel="noopener noreferrer"><i class="fab fa-linkedin"></i> LinkedIn</a>
      <a href="https://github.com/amit-sage"><i class="fab fa-github"target="_blank" rel="noopener noreferrer"></i> GitHub</a>
      <a href="https://www.snapchat.com/add/amitab0001?share_id=kh4Mj4O39BQ&locale=en-GB"target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-snapchat"></i> Snapchat</a>
      <a href="mailto:contact.amitkumar143@gmail.com"target="_blank" rel="noopener noreferrer"><i class="fas fa-envelope"></i> Contact</a>
    </div>
    <footer>&copy;2025 Amit Choudhary. All Rights Reserved.</footer>
  </div>
  <script>
    window.addEventListener("beforeunload", function () {
      const card = document.getElementById("profileCard");
      card.classList.add("out");
    });
  </script>
</body>
</html>
